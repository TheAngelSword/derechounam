services:
  archivos:
    build: .
    image: derechounam-archivos:actual
    restart: unless-stopped
    # Reachable only from this machine; Caddy publishes it with HTTPS.
    ports:
      - "127.0.0.1:8795:8795"
    env_file: .env
    volumes:
      - /srv/derechounam-archivos/data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
