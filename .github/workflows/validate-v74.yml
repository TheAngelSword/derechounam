name: Validar Facultad V7.4
on:
  push:
    branches: [mejora-v74, prueba-v7]
  pull_request:
    branches: [prueba-v7, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Pruebas de regresion
        run: node --experimental-strip-types --test tests/v7/*.test.ts tests/v71/*.test.ts tests/v72/*.test.ts
      - name: Sintaxis de TypeScript
        run: npm run check:syntax
      - name: Build sin migrar bases remotas
        run: npm run build:code
        env:
          DATABASE_URL: ''
          BETTER_AUTH_URL: http://localhost:8080
          VITE_PUBLIC_HOSTNAME: localhost:8080
          APP_PUBLIC_URL: http://localhost:8080
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Revisar navegacion real
        run: node scripts/check-v72-browser.mjs
