name: Preparar validación V7.3
on:
  push:
    branches: [mejora-v73]
    paths: [.github/workflows/prepare-v73.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Empaquetar código versionado y dependencias de validación
        run: |
          mkdir -p /tmp/fd-v73-source
          git archive HEAD | tar -x -C /tmp/fd-v73-source
          cp -a node_modules /tmp/fd-v73-source/
          tar -czf /tmp/fd-v73-validation.tar.gz -C /tmp/fd-v73-source .
      - uses: actions/upload-artifact@v4
        with:
          name: entorno-v73
          path: /tmp/fd-v73-validation.tar.gz
          retention-days: 1
