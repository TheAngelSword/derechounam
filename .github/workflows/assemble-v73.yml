name: Ensamblar y validar V7.3
on:
  push:
    branches: [mejora-v73]
permissions:
  contents: write
concurrency:
  group: ensamblar-v73
  cancel-in-progress: true
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Aplicar cambios revisados con guardas de integridad
        run: node scripts/assemble-v73.mjs
      - run: npm ci
      - name: Pruebas de contenido, privacidad y migración local
        run: node --experimental-strip-types --test tests/v7/*.test.ts tests/v71/*.test.ts tests/v72/*.test.ts tests/v73/*.test.ts
      - run: npm run check:syntax
      - name: Compilar sin tocar bases remotas
        run: npm run build:code
        env:
          DATABASE_URL: ''
          BETTER_AUTH_URL: http://localhost:8080
          APP_PUBLIC_URL: http://localhost:8080
          VITE_PUBLIC_HOSTNAME: localhost:8080
      - name: Instalar Chromium en el runner Ubuntu
        run: npx playwright install chromium
        timeout-minutes: 3
      - name: Probar juegos, cuentas y diseño en navegador local
        run: node --experimental-strip-types scripts/check-v73-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v73-validacion-${{ github.run_id }}
          path: test-results/v73
          retention-days: 7
      - name: Guardar sólo el ensamblado probado en mejora-v73
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "mejora-v73"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore src
          if ! git diff --cached --quiet; then
            git commit -m "Integra V7.3 tras pruebas de juegos, cuentas y navegador"
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:mejora-v73
          fi
